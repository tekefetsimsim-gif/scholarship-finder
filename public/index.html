<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">

  <title>Scholarship Finder</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <header class="header">
    <div class="logo">Scholarship Finder</div>

    <nav>
      <a href="#search">Search</a>
      <a href="#results">Results</a>
      <a href="#about">About</a>
    </nav>
  </header>

  <main>

    <section class="hero" id="search">
      <div class="hero-content">

        <h1>Find Your Master's Scholarship</h1>

        <p>
          Discover Master's programmes and scholarships in
          Europe, USA, Canada and Australia.
        </p>

        <div class="search-box">
          <input
            id="searchInput"
            type="text"
            placeholder="Example: Mathematics, Data Science..."
          >

          <button id="searchButton">Search</button>
        </div>

        <div class="quick-filters">
          <button data-query="Mathematics">Mathematics</button>

          <button data-query="Mathematics Education">
            Mathematics Education
          </button>

          <button data-query="Applied Mathematics">
            Applied Mathematics
          </button>

          <button data-query="Statistics">Statistics</button>

          <button data-query="Data Science">Data Science</button>

          <button data-query="Data Analytics">Data Analytics</button>

          <button data-query="Computational Mathematics">
            Computational Mathematics
          </button>
        </div>

      </div>
    </section>

    <section class="filters">

      <h2>Filter Opportunities</h2>

      <div class="filter-grid">

        <div>
          <label for="region">Region</label>

          <select id="region">
            <option value="all">All regions</option>
            <option value="Europe">Europe</option>
            <option value="USA">USA</option>
            <option value="Canada">Canada</option>
            <option value="Australia">Australia</option>
          </select>
        </div>

        <div>
          <label for="english">English requirement</label>

          <select id="english">
            <option value="all">All</option>
            <option value="moi">MOI accepted</option>
            <option value="waiver">Possible English waiver</option>
            <option value="required">IELTS/TOEFL mentioned</option>
          </select>
